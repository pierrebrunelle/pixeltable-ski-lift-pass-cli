[project]
name = "pixeltable-ski-lift-pass-cli"
version = "0.1.0"
description = "A command-line tool for ski-lift turnstiles: passes and gate scans as Pixeltable tables with a computed gate verdict, a per-zone view built with list_iterator, OpenTelemetry span traces of every command, and the same commands against a Pixeltable Cloud database - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "computed-columns", "data-infrastructure", "ski-lift-pass-cli"]
dependencies = [
    "pixeltable>=0.7.23",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-pixeltable>=0.2.0",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
